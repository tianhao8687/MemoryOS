name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip ".[ann,dev]"

      - name: Cache required Tree-sitter parsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/tree-sitter-language-pack
          key: tree-sitter-language-pack-${{ runner.os }}-${{ runner.arch }}-1.14.3

      - name: Install required Tree-sitter parsers
        env:
          GH_TOKEN: ${{ github.token }}
          TSLP_BUNDLE_SHA256: 935c0990f08cde9f41ff5519de5129b6b73acebcc80a6db647a1aadf5ca19a77
          TSLP_VERSION: 1.14.3
        run: |
          if ! python -c "from tree_sitter_language_pack import downloaded_languages; required = {'python', 'typescript', 'javascript', 'rust'}; raise SystemExit(0 if required <= set(downloaded_languages()) else 1)"; then
            archive="${RUNNER_TEMP}/parsers-linux-x86_64.tar.zst"
            cache_dir="$(python -c 'from tree_sitter_language_pack import cache_dir; print(cache_dir())')"
            gh release download "v${TSLP_VERSION}" \
              --repo xberg-io/tree-sitter-language-pack \
              --pattern parsers-linux-x86_64.tar.zst \
              --output "${archive}"
            echo "${TSLP_BUNDLE_SHA256}  ${archive}" | sha256sum --check --strict -
            mkdir -p "${cache_dir}"
            tar --extract --zstd --file "${archive}" --directory "${cache_dir}" \
              ./libtree_sitter_python.so \
              ./libtree_sitter_typescript.so \
              ./libtree_sitter_javascript.so \
              ./libtree_sitter_rust.so
          fi
          python -c "from tree_sitter_language_pack import get_parser; [get_parser(name) for name in ('python', 'typescript', 'javascript', 'rust')]"

      - name: Check imports
        run: python -c "import memoryos; assert memoryos.__version__ == '2.2.0'"

      - name: Lint
        run: python -m ruff check memoryos tests scripts

      - name: Check formatting
        run: python -m ruff format --check memoryos tests scripts

      - name: Check generated readiness status
        run: python scripts/sync_project_status.py --check

      - name: Type-check
        run: python -m mypy memoryos

      - name: Run backend tests
        run: python -m pytest -q

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir build/wheel

  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Audit Python production dependencies
        run: |
          python -m pip install --upgrade pip pip-audit ".[ann]"
          python -m pip_audit --local --skip-editable

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Audit frontend production dependencies
        working-directory: web
        run: pnpm audit --prod --audit-level high
