[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "memoryos"
version = "2.2.0"
description = "Local-first coding-agent memory intelligence layer"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "MemoryOS Contributors" }]
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "mcp>=1.12,<2",
  "numpy>=2.2,<3",
  "platformdirs>=4.3,<5",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "rich>=14,<15",
  "sqlalchemy>=2.0.41,<3",
  "tree-sitter-language-pack==1.14.3",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
ann = [
  "sqlite-vec>=0.1.6,<1",
]
dev = [
  "hatchling>=1.27,<2",
  "mypy>=1.16,<2",
  "pyinstaller>=6.14,<7",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
memoryos = "memoryos.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["memoryos"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["build", "dist", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S108"]
"scripts/**/*.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["build", "dist", "web", "memoryos/db/migrations"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mcp.*", "alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
markers = [
  "acceptance: mandatory V1 compatibility acceptance scenario (A01-A14)",
  "v2: mandatory A15-A32 Memory Intelligence acceptance scenario",
  "slow: packaging, performance, or browser test",
  "v21: mandatory A33-A52 Reality Intelligence hardening scenario",
  "v22: mandatory MemoryOS V2.2 hardening scenario",
]
